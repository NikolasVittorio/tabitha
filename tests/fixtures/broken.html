<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="background:#fff">
  <p style="color:#999">Low contrast grey text on white.</p>
  <button><svg width="16" height="16"><circle cx="8" cy="8" r="6"/></svg></button>
  <img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
  <div id="trap" tabindex="0">Keyboard trap</div>
  <a href="#x" style="outline:none">No focus indicator</a>
  <script>
    const t = document.getElementById("trap");
    t.addEventListener("keydown", e => { if (e.key === "Tab") { e.preventDefault(); t.focus(); } });
  </script>
</body>
</html>
