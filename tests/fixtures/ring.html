<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Offset ring</title>
<style>
  a { display: inline-block; margin: 40px; }
  a:focus-visible { outline: 2px solid #1a4fd6; outline-offset: 8px; }
</style>
</head>
<body>
  <a href="#a">One</a>
  <a href="#b">Two</a>
  <a href="#c">Three</a>
</body>
</html>
