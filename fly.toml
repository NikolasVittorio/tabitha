# Always-on worker. The mailbox connects outbound; nothing is exposed publicly.
app = "tabitha-<CHANGE_ME>"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

# No [http_service] and no [[services.ports]]: no public listener. This block only
# carries the always-on settings for the Bureau port (reachable via `fly proxy`).
[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
